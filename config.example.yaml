# Copia este fichero a config.local.yaml y ajústalo.
# config.local.yaml está en .gitignore y NUNCA se sube al repositorio.

# Modo de ingesta:
#   mock -> genera fotos sintéticas realistas para probar TODO el sistema sin
#           tocar los servicios reales ni necesitar credenciales. Ideal para el
#           primer arranque: copia este fichero, arranca y ejecuta las búsquedas.
#   live -> usa los adaptadores reales y verificados:
#             * AP     — API de búsqueda anónima (sin login)
#             * Getty  — páginas de búsqueda por HTTP (sin login)
#             * AFP    — distribuido por Getty (collections=afp)
#             * Reuters— navegador con sesión iniciada (login humano; ver README)
mode: mock

# Dónde se guardan la base de datos SQLite y las fotos descargadas.
data_dir: ./data
db_url: sqlite:///./data/app.db

# Cadencia por defecto (minutos) al crear búsquedas nuevas. El refresco es GLOBAL
# (todas a la vez) y se configura desde el panel → ajustes.
default_cadence_minutes: 360

# Refresco periódico de la sesión de Reuters para que no caduque. Cada ciclo hace
# una búsqueda real: eso renueva el token (no solo la cookie de datadome) y es lo
# que hace que la sesión dure y no haya que re-loguear a mano tan seguido. Debe ir
# por debajo de la vida del token (~24 h), así que 60 min sobra. 0 = desactivado.
reuters_keepalive_minutes: 60

agencies:
  ap:
    enabled: true
    username: null      # AP no necesita credenciales
    password: null

  reuters:
    enabled: true
    # Reuters se usa con TU sesión, que inicias a mano una vez desde
    # «ajustes → iniciar sesión en Reuters». El programa NUNCA teclea tu
    # contraseña (automatizar el login hace que Reuters bloquee la cuenta),
    # así que no hace falta escribirla aquí. username es solo informativo.
    username: null
    password: null

  getty:                # Getty y AFP se sirven ambos por aquí
    enabled: true
    username: null      # las previews con marca de agua no necesitan login
    password: null

# Aviso opcional cuando algo se rompe (disparo por flanco: un aviso en el PRIMER
# fallo tras funcionar; se rearma al recuperarse). webhook_url recibe un POST
# JSON {subject, message}; puedes apuntarlo a tu propio webhook.
#
# agencies filtra SOLO los avisos de «ha dejado de funcionar» (el veredicto lo da
# el refresco global entero: la agencia es buena si TODAS sus búsquedas van bien).
# Los avisos de la sesión de Reuters («la sesión ha caducado») y los del
# vigilante del keep-alive no pasan por ese filtro: no cuentan una avería del
# servicio, sino que hace falta una persona.
#
# ¿No tienes webhook? ntfy.sh sirve sin crear cuenta: los avisos llegan a un
# tema que ves en el navegador o en su app del móvil (notificación push):
#   webhook_url: "https://ntfy.sh/UN-TEMA-SECRETO?tpl=yes&t={{.subject}}&m={{.message}}"
# Elige un tema largo e impredecible (hace de contraseña). Para que además te
# lo reenvíe POR CORREO, ntfy exige una cuenta gratuita: con su token, añade
# a la URL «&email=tu@correo.com&auth=<token en base64>».
#
# postdata: coletilla que se añade al final de TODOS los avisos — instrucciones
# para quien lo reciba («abre tal cosa», «avisa a tal persona»). Opcional.
alerts:
  enabled: false
  webhook_url: null
  agencies: [reuters]
  postdata: null

playwright:
  # Solo Reuters usa navegador (está tras el muro anti-bot DataDome). Con true no
  # se abre NINGUNA ventana: verificado que DataDome deja pasar el headless nuevo
  # de Chrome cuando la sesión ya está guardada en el perfil. El login manual
  # (scripts.login_reuters) abre la ventana aunque esto esté en true, porque ahí
  # hace falta una persona.
  headless: true
  timeout_ms: 45000
  # Perfil de navegador persistente (guarda la sesión de Reuters entre arranques).
  user_data_dir: ./data/browser
  # Ruta a un binario de Chrome/Chromium. Déjalo en null: en Windows se usa
  # automáticamente el Google Chrome instalado, que además da mejor huella para
  # DataDome (y el Chromium que empaqueta Playwright ni siquiera arranca headed
  # en Windows: falla por SxS y sale como "spawn UNKNOWN").
  #   Windows: C:/Program Files/Google/Chrome/Application/chrome.exe
  #   Linux:   /usr/bin/google-chrome
  executable_path: null
