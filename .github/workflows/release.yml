# Empaqueta el programa para Windows, macOS y Linux, comprueba en CADA sistema
# que arranca de verdad, y cuelga los tres paquetes de una release.
#
# El objetivo es que nadie compile: ni quien lo descarga ni quien lo publica.
#
#     git tag v1.2.0 && git push origin v1.2.0
#
# Windows sale como versión PORTABLE (un Python embebido que un .bat arranca
# sobre el código); macOS y Linux, como ejecutable de PyInstaller. El porqué de
# la diferencia está en build.py. Nada de esto se compila cruzado, así que cada
# sistema sale de su propio runner.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # para crear la release

jobs:
  paquete:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: windows
          - os: macos-latest
            nombre: macos
          - os: ubuntu-latest
            nombre: linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.nombre }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias (para las pruebas)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: PyInstaller (solo macOS y Linux)
        if: runner.os != 'Windows'
        # Windows no usa PyInstaller: sale como versión portable con un .bat.
        run: pip install pyinstaller

      - name: Chromium para empaquetarlo (macOS y Linux)
        if: runner.os != 'Windows'
        # En Windows siempre hay Edge; en macOS y Linux puede no haber navegador.
        run: python -m playwright install chromium

      - name: Pruebas
        run: python -m pytest tests/ -q

      - name: Compilar
        run: python build.py --sin-zip

      - name: Comprobar que arranca (Windows, versión portable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NPS_PORTABLE = "1"
          $exe = "dist/newsphotostalker/python/python.exe"
          $proc = Start-Process $exe -ArgumentList "run.py" -PassThru -WorkingDirectory "dist/newsphotostalker"
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 2
            try {
              if ((Invoke-WebRequest "http://127.0.0.1:8010/login" -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "no respondió en el puerto 8010" }
          if (-not (Test-Path "dist/newsphotostalker/newsphotostalker.bat")) { throw "falta el lanzador .bat" }
          if (-not (Test-Path "dist/newsphotostalker/data/app.db")) { throw "no creó data/app.db junto al lanzador" }
          if (-not (Test-Path "dist/newsphotostalker/config.local.yaml")) { throw "no creó config.local.yaml" }
          Write-Host "arranca y crea sus datos donde debe"

      - name: Comprobar el navegador desde el Python embebido (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Que el Python embebido trae Playwright, que app importa y que el runner
        # tiene un navegador que detectar. El arranque real del navegador se
        # verifica en macOS y Linux, con la misma versión de Playwright.
        run: |
          cd dist/newsphotostalker
          ./python/python.exe -c "import sys; sys.path.insert(0,'.'); import playwright, psutil; from app.ingest.live_base import system_browser; b=system_browser(); print('navegador:', b, '| psutil', psutil.__version__); assert b, 'el runner no expone ningun navegador'"

      - name: Comprobar que arranca (macOS y Linux)
        if: runner.os != 'Windows'
        run: |
          ./dist/newsphotostalker/newsphotostalker &
          PID=$!
          ok=0
          for i in $(seq 1 40); do
            sleep 2
            if curl -fsS http://127.0.0.1:8010/login > /dev/null 2>&1; then ok=1; break; fi
          done
          kill $PID 2>/dev/null || true
          [ "$ok" = "1" ] || { echo "no respondió en el puerto 8010"; exit 1; }
          [ -f dist/newsphotostalker/data/app.db ] || { echo "no creó data/app.db"; exit 1; }
          [ -f dist/newsphotostalker/config.local.yaml ] || { echo "no creó config.local.yaml"; exit 1; }
          echo "arranca y crea sus datos donde debe"

      - name: Comprobar que el navegador empaquetado arranca (macOS y Linux)
        if: runner.os != 'Windows'
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          browsers = Path("dist/newsphotostalker/data/browsers")
          encontrados = sorted(browsers.glob("chromium*")) if browsers.is_dir() else []
          if not encontrados:
              sys.exit("el arranque no ha desempaquetado Chromium en data/browsers")
          print("desempaquetado:", [c.name for c in encontrados])
          os.environ["PLAYWRIGHT_BROWSERS_PATH"] = str(browsers.resolve())
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              b = pw.chromium.launch(headless=True)
              b.new_page().goto("about:blank")
              print("el Chromium empaquetado arranca:", b.version)
              b.close()
          PY

      - name: Comprimir, ya sin los restos de la prueba
        shell: bash
        run: |
          rm -rf dist/newsphotostalker/data dist/newsphotostalker/config.local.yaml
          python build.py --solo-zip

      - uses: actions/upload-artifact@v4
        with:
          name: newsphotostalker-${{ matrix.nombre }}
          path: dist/*.zip

  publicar:
    needs: paquete
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
      - name: Publicar la release
        uses: softprops/action-gh-release@v2
        with:
          files: paquetes/**/*.zip
          generate_release_notes: true
          body: |
            Download the package for your system, unzip it and run it. Nothing to install.

            | System | File | Run |
            |---|---|---|
            | **Windows** | `…-windows-…zip` | double-click `newsphotostalker.bat` |
            | **macOS** | `…-macos-…zip` | right-click `newsphotostalker` → *Open* → *Open* |
            | **Linux** | `…-linux-…zip` | `./newsphotostalker` |

            Then the panel opens by itself. Sign in with **`admin` / `admin`** and
            change it under settings → your account (`ajustes → tu cuenta`). The
            panel is in Spanish.

            Your photos and database are created in a `data/` folder **next to the
            launcher**. Back that up and you have backed up everything.

            For **Reuters**, sign in once from settings → sign in to Reuters
            (`ajustes → iniciar sesión en Reuters`). On a headless server, sign in
            on your laptop and move the session with `exportar sesión` /
            `importar sesión`.
