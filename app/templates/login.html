{% extends "base.html" %}
{% block title %}Entrar · newsphotostalker{% endblock %}
{% block content %}

<div class="login-wrap">
  <form method="post" action="/login" class="form-card login-card">
    <h1>newsphotostalker</h1>
    {% if error %}<p class="err-msg">Usuario o contraseña incorrectos.</p>{% endif %}
    <label>Usuario
      <input type="text" name="username" required autofocus autocomplete="username">
    </label>
    <label>Contraseña
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <label class="checkbox">
      <input type="checkbox" name="remember" checked>
      Recordar la sesión en este navegador
    </label>
    <button class="btn btn-primary">Entrar</button>
  </form>
</div>

{% endblock %}
